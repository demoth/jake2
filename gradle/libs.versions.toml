[versions]
junit5 = "5.10.5"
commonsCsv = "1.14.1"
logbackClassic = "1.6.5"
gdx = "1.12.1"
gdxControllers = "2.2.3"
ktx = "1.12.1-rc1"
kotlin = "2.4.20"
graalNativeBuildTools = "0.9.28"
beryxRuntime = "1.13.0"
gitProperties = "4.0.1"
kotlinxSerialization = "1.11.0"
jackson = "2.18.6"
graalHelper = "2.0.1"

[libraries]
# JUNIT
junitJupiterApi = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit5" }
junitJupiterParams = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit5" }
junitJupiterEngine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit5" }
junitPlatformLauncher = { module = "org.junit.platform:junit-platform-launcher" }

# GDX
gdx = { module = "com.badlogicgames.gdx:gdx", version.ref = "gdx" }
gdxControllersCore = { module = "com.badlogicgames.gdx-controllers:gdx-controllers-core", version.ref = "gdxControllers" }
gdxFreetype = { module = "com.badlogicgames.gdx:gdx-freetype", version.ref = "gdx" }
gdxControllersDesktop = { module = "com.badlogicgames.gdx-controllers:gdx-controllers-desktop", version.ref = "gdxControllers" }
gdxBackendLwjgl3 = { module = "com.badlogicgames.gdx:gdx-backend-lwjgl3", version.ref = "gdx" }
gdxPlatform = { module = "com.badlogicgames.gdx:gdx-platform", version.ref = "gdx" }
gdxFreetypePlatform = { module = "com.badlogicgames.gdx:gdx-freetype-platform", version.ref = "gdx" }
gdxBackendHeadless = { module = "com.badlogicgames.gdx:gdx-backend-headless", version.ref = "gdx" }
gdxTools = { module = "com.badlogicgames.gdx:gdx-tools", version.ref = "gdx" }
gdxSvmhelperAnnotations = { module = "io.github.berstanio:gdx-svmhelper-annotations", version.ref = "graalHelper" }
gdxSvmhelperBackendLwjgl3 = { module = "io.github.berstanio:gdx-svmhelper-backend-lwjgl3", version.ref = "graalHelper" }
gdxSvmhelperExtensionFreetype = { module = "io.github.berstanio:gdx-svmhelper-extension-freetype", version.ref = "graalHelper" }

# KTX
ktxActors = { module = "io.github.libktx:ktx-actors", version.ref = "ktx" }
ktxApp = { module = "io.github.libktx:ktx-app", version.ref = "ktx" }
ktxAssets = { module = "io.github.libktx:ktx-assets", version.ref = "ktx" }
ktxCollections = { module = "io.github.libktx:ktx-collections", version.ref = "ktx" }
ktxFreetype = { module = "io.github.libktx:ktx-freetype", version.ref = "ktx" }
ktxGraphics = { module = "io.github.libktx:ktx-graphics", version.ref = "ktx" }
ktxLog = { module = "io.github.libktx:ktx-log", version.ref = "ktx" }
ktxScene2d = { module = "io.github.libktx:ktx-scene2d", version.ref = "ktx" }

# Kotlin
kotlinBom = { module = "org.jetbrains.kotlin:kotlin-bom", version.ref = "kotlin" }
kotlinStdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlinxSerializationJson = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Jackson
jacksonDatabind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jacksonModuleKotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }

# Other
commonsCsv = { module = "org.apache.commons:commons-csv", version.ref = "commonsCsv" }
logbackClassic = { module = "ch.qos.logback:logback-classic", version.ref = "logbackClassic" }

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
gitProperties = { id = "com.gorylenko.gradle-git-properties", version.ref = "gitProperties" }
beryxRuntime = { id = "org.beryx.runtime", version.ref = "beryxRuntime" }
graalNativeBuildTools = { id = "org.graalvm.buildtools.native", version.ref = "graalNativeBuildTools" }
