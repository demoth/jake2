plugins {
  alias(libs.plugins.kotlinJvm) apply false
  alias(libs.plugins.kotlinSerialization) apply false
  alias(libs.plugins.gitProperties) apply false
}

subprojects {
  apply plugin: 'java-library'
  apply plugin: 'org.jetbrains.kotlin.jvm'
  apply plugin: 'jacoco'

  group = 'org.demoth'
  version = '1.2.1'
  ext.appName = 'cake'

  kotlin {
    jvmToolchain(25)
  }

  dependencies {
    implementation(platform(rootProject.libs.kotlinBom))
    testImplementation(rootProject.libs.junitJupiterApi)
    testImplementation(rootProject.libs.junitJupiterParams)
    testRuntimeOnly(rootProject.libs.junitPlatformLauncher)
    testRuntimeOnly(rootProject.libs.junitJupiterEngine)
  }

  tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // Explicitly allow libGDX/LWJGL to load native libraries without Java 25 warnings.
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    finalizedBy(tasks.named('jacocoTestReport'))
  }

  tasks.withType(JacocoReport).configureEach {
    dependsOn(tasks.withType(Test))

    reports {
      xml.required = true
      html.required = true
      csv.required = false
    }
  }
}
