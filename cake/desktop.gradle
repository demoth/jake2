def os = System.properties['os.name'].toLowerCase()

sourceSets.main.resources.srcDirs += [ rootProject.file('assets').path ]
application {
  applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
  // GLFW needs this in packaged launchers as well as Gradle run.
  if (os.contains('mac')) applicationDefaultJvmArgs += '-XstartOnFirstThread'
}
dependencies {
  runtimeOnly(rootProject.libs.gdxPlatform) {
    artifact {
      classifier = 'natives-desktop'
    }
  }
  implementation project(':cake:desktop-common')
}

def iconsDir = project.file('icons')

run {
  outputs.upToDateWhen { false }
  workingDir = rootProject.file('assets').path
}

// jpackage consumes installDist; keep portable distZip archives unchanged.
def nativePlatform = os.contains('win') ? 'windows' : os.contains('mac') ? 'macos' : 'linux'
def nativeArch = System.properties['os.arch'].toLowerCase()
def nativeSuffix = ['amd64': '', 'x86_64': '', 'aarch64': '-arm64', 'arm64': '-arm64']
tasks.named('installDist') {
  inputs.property('nativeClassifier', "${nativePlatform}-${nativeArch}")
  exclude { details ->
    def nativeJar = details.name =~ /^lwjgl.*-natives-(.+)\.jar$/
    if (!nativeJar.matches()) return false
    if (!nativeSuffix.containsKey(nativeArch)) throw new GradleException("Unsupported desktop architecture: $nativeArch")
    nativeJar[0][1] != nativePlatform + nativeSuffix[nativeArch]
  }
}

runtime {
  options.set(['--strip-debug', '--compress', 'zip-6', '--no-header-files', '--no-man-pages'])
  modules.set(['jdk.unsupported'])
  additive = true
  jpackage {
    skipInstaller = true
    if (os.contains('win')) {
      imageOptions = ['--icon', new File(iconsDir, 'logo.ico').absolutePath]
    } else if (os.contains('nix') || os.contains('nux') || os.contains('bsd')) {
      imageOptions = ['--icon', new File(iconsDir, 'logo.png').absolutePath]
    } else if (os.contains('mac')) {
      imageOptions = ['--icon', new File(iconsDir, 'logo.icns').absolutePath]
    }
  }
}

tasks.named('jpackageImage') {
  // Beryx runtime and jpackageImage share the generated runtime directory.
  mustRunAfter('runtime')
}

if (providers.gradleProperty('enableGraalNative').getOrElse('false').toBoolean()) {
  apply plugin: 'org.graalvm.buildtools.native'
  apply from: rootProject.file('cake/nativeimage.gradle')
}
